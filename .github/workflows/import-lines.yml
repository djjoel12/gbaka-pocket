name: VTC Database Sync

on:
  push:
    paths:
      - 'data/**' # S'exécute automatiquement dès qu'un fichier bouge dans data

jobs:
  run-import:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: 🟢 Configurer l'environnement Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 📦 Installer les dépendances
        run: |
          npm init -y
          npm install @supabase/supabase-js

            - name: Lancer la conversion et l'importation PostGIS
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node import.js
        
