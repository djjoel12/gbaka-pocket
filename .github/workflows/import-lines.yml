name: VTC Database Sync

on:
  push:
    paths:
      - 'data/**' # S'exécute dès que vous ajoutez un fichier .json dans le dossier data

jobs:
  run-import:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 🟢 Configurer l'environnement Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Installer le client Supabase
        run: |
          npm init -y
          npm install @supabase/supabase-js

      - name: 🚀 Lancer la conversion et l'importation PostGIS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node import.js
        
